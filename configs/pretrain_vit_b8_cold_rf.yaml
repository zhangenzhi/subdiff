# Run 12 — Cold-Rectified-Flow Refiner.
#
# Trains a v-head on the chain
#     x_t = (1-t)·x_0 + t·μ
# where μ comes from a separate FROZEN mu_model (Run X dual-RF p8 ep 269+).
# Refiner has v-head only (dual_decoder=False); the x_0-head lives in the
# frozen mu_model.
#
# Motivation (see docs/experiments.md Run 12 section):
#   - Standard RF starts from pure Gaussian noise — wastes capacity on
#     denoising the isotropic null space and Run X v-head is already at
#     its theoretical floor at t=1 (= MSE(μ, x_0) ≈ 0.126 measured).
#   - Cold-diffusion variant replaces noise with a context-conditional
#     mean estimate. Refiner only learns the high-freq residual.
#   - Inference: K-step Euler reverse from x_t=μ to x_t=x_0 (potentially
#     K=2-4 suffices because we start much closer to the answer).

data:
  imagenet_dir: /lustre1/work/c30636/dataset/imagenet
  image_size: 224
  num_workers: 8
  transform_type: diffusion

model:
  patch_size: 8
  embed_dim: 768
  depth: 12
  num_heads: 12
  decoder_embed_dim: 512    # unused with dit_minimal_head
  decoder_depth: 4
  decoder_num_heads: 8
  dual_decoder: false       # Refiner has v-head only
  clean_ratio: 0.25
  pixel_loss_weight: 0.0    # no x_0-head, weight irrelevant
  qk_norm: true
  dit_minimal_head: true
  use_indicators: true
  pos_embed_type: sincos
  cold_rf: true             # ← enables Run 12 path
  cold_rf_mu_config: configs/pretrain_vit_b8_dual_rf.yaml
  cold_rf_mu_ckpt:   logs_dual_rf_p8/checkpoints/checkpoint_latest.pth

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule_type: linear
  flow_matching: true       # needed for self.rf (sample_t)
  rf_t_sampling: logit_normal
  rf_logit_mean: 0.0
  rf_logit_std: 1.0

curriculum:
  t_min_start: 0
  t_min_end: 0
  t_max_start: 0
  t_max_end: 0
  clean_ratio_start: 0.25
  clean_ratio_end: 0.25
  warmup_epochs: 0
  schedule: linear

training:
  epochs: 100               # task is "polish residual" — should converge fast
  batch_size: 64            # per GPU; global = 64 × 16 = 1024
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.0
  warmup_epochs: 0
  lr_schedule: constant
  optimizer: adamw
  clip_grad: 1.0

probe:
  eval_every: 20
  probe_lr: 0.1
  probe_epochs: 30
  num_classes: 1000

logging:
  log_dir: ./logs_run12_cold_rf
  save_every: 5
  print_every: 100
